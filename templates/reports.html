{% extends "base.html" %}{% block content %}<div class="page-head"><div><div class="eyebrow">ANALYTICS</div><h1>Sales reports</h1><p class="muted">Daily sales totals for the last seven days.</p></div><a class="btn btn-outline-light" href="{{ url_for('export_sales') }}">Export CSV</a></div><div class="panel"><canvas id="salesChart" height="100"></canvas></div><div class="row g-3 mt-1"><div class="col-md-6"><div class="stat"><small>All-time transactions</small><h2>{{ all_sales }}</h2></div></div><div class="col-md-6"><div class="stat"><small>Active products</small><h2>{{ all_products }}</h2></div></div></div>{% endblock %}{% block scripts %}<script src="https://cdn.jsdelivr.net/npm/chart.js"></script><script>new Chart(document.getElementById('salesChart'),{type:'bar',data:{labels:{{ labels|tojson }},datasets:[{label:'Sales ({{ currency }})',data:{{ values|tojson }},borderRadius:7}]},options:{plugins:{legend:{labels:{color:'#d9deea'}}},scales:{x:{ticks:{color:'#aab3c5'},grid:{color:'#293247'}},y:{ticks:{color:'#aab3c5'},grid:{color:'#293247'}}}}});</script>{% endblock %}
