{% extends "base.html" %}{% block content %}<div class="page-head"><div><div class="eyebrow">ACCESS CONTROL</div><h1>Staff accounts</h1></div></div><div class="row g-3"><div class="col-lg-5"><div class="panel"><h5>Create account</h5><form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label class="form-label">Username</label><input class="form-control mb-3" name="username" required minlength="3"><label class="form-label">Temporary password</label><input class="form-control mb-3" type="password" name="password" required minlength="10"><label class="form-label">Role</label><select class="form-select mb-3" name="role"><option value="cashier">Cashier</option><option value="admin">Administrator</option></select><button class="btn btn-gold">Create user</button></form></div></div><div class="col-lg-7"><div class="panel"><h5>Team members</h5><table class="table"><tr><th>Username</th><th>Role</th><th>Status</th></tr>{% for u in users %}<tr><td>{{ u.username }}</td><td>{{ u.role }}</td><td>{{ 'Active' if u.active else 'Disabled' }}</td></tr>{% endfor %}</table></div></div></div>{% endblock %}
